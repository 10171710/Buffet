<!-- PARTIAL head.html: the <head> contents shared by every page.
     Never edit this block inside a page. Edit it here, then run: python docs/sync-partials.py
     Placeholders filled per page from the @head marker JSON: {{PAGE_TITLE}} {{PAGE_DESCRIPTION}} {{PAGE_URL}}.
     The SEO block (canonical, Open Graph, Twitter) becomes a robots noindex tag when the page sets "robots": "noindex".
     The SCHEMA line becomes one JSON-LD script per entry of the page's "schema" option (or disappears).
     Before publishing: replace https://www.example.com/hearth-harvest/ with the real site URL (also SITE in sync-partials.py).
     RULE for every partial: this documentation comment must never contain the HTML comment terminator. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<meta name="theme-color" content="#a63f24">
<meta name="color-scheme" content="light dark">
<!-- @SEO -->
<link rel="canonical" href="{{PAGE_URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hearth &amp; Harvest">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="https://www.example.com/hearth-harvest/assets/img/social-card.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="https://www.example.com/hearth-harvest/assets/img/social-card.jpg">

<!-- Pre-paint: applies the saved theme and language/direction BEFORE first paint (no flash) and writes the
     matching Bootstrap build (LTR or RTL) with id bs-css. Keys: hh-theme (light|dark), hh-dir (en|ar|he).
     This is the ONLY inline script a page may contain. -->
<script>
(function () {
  var d = document.documentElement, t = null, r = 'en';
  try { t = localStorage.getItem('hh-theme'); r = localStorage.getItem('hh-dir') || 'en'; } catch (e) {}
  if (r !== 'ar' && r !== 'he') r = 'en';
  if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  var rtl = r !== 'en';
  d.setAttribute('data-bs-theme', t); d.setAttribute('lang', r); d.setAttribute('dir', rtl ? 'rtl' : 'ltr');
  document.write('<link rel="stylesheet" id="bs-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap' + (rtl ? '.rtl' : '') + '.min.css">');
})();
</script>
